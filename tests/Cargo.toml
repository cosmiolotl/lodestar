[package]
name = "lodestar-e2e"
description = "End-to-end tests: real lodestar, lodeproxy and Fabric nodes running Lodecore, driven by scripted players"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "harness/lib.rs"
test = false
doctest = false

[[test]]
name = "e2e"
path = "suite/main.rs"
harness = false

[dependencies]
lodeproxy = { path = "../crates/lodeproxy" }
anyhow.workspace = true
bytes.workspace = true
flate2 = "1"
libtest-mimic = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }
